apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helpdesk-email-triage-rhaii
  namespace: openshift-gitops
  labels:
    tenants.id: helpdesk-email-triage-demo
    app.kubernetes.io/part-of: helpdesk-email-triage-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: tenants
  source:
    repoURL: https://github.com/rh-ai-quickstart/helpdesk-email-triage.git
    targetRevision: main
    # Existing-project overlay (Namespace owned by this tenant's base)
    path: deploy/openshift/overlays/helpdesk-email-triage-rhaii
  destination:
    server: https://kubernetes.default.svc
    namespace: helpdesk-email-triage
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 20m
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
