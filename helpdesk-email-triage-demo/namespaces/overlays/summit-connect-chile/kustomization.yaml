apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Upstream quickstart cannot be included as a remote Kustomize base (configMapGenerator
# sample_emails paths fail loadRestrictor). Sync it via nested Application instead.
resources:
  - ../../base
  - application-rhaii.yaml
  - patch-rhaii-affinity-job.yaml
