apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhaii-cpu
spec:
  template:
    spec:
      # Prefer dedicated lab-infra MachineSet label when present; require AVX512 (RHAII).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/cpu-cpuid.AVX512F
                    operator: In
                    values:
                      - "true"
