---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-copy-redhat-registry-pull
  namespace: helpdesk-email-triage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-copy-redhat-registry-pull
  namespace: helpdesk-email-triage
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-copy-redhat-registry-pull
  namespace: helpdesk-email-triage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-copy-redhat-registry-pull
subjects:
  - kind: ServiceAccount
    name: job-copy-redhat-registry-pull
    namespace: helpdesk-email-triage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-copy-redhat-registry-pull-read
  namespace: openshift-config
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - pull-secret
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-copy-redhat-registry-pull-read
  namespace: openshift-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-copy-redhat-registry-pull-read
subjects:
  - kind: ServiceAccount
    name: job-copy-redhat-registry-pull
    namespace: helpdesk-email-triage
