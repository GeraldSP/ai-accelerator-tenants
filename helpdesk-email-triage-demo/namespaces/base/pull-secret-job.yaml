---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-copy-redhat-registry-pull
  namespace: helpdesk-email-triage
  labels:
    app.kubernetes.io/part-of: helpdesk-email-triage-demo
data:
  copy.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    NS="${TARGET_NAMESPACE:-helpdesk-email-triage}"
    echo "Copying openshift-config/pull-secret -> ${NS}/redhat-registry-pull"
    oc get secret pull-secret -n openshift-config -o json \
      | python3 -c '
    import json,sys
    s=json.load(sys.stdin)
    for k in ("resourceVersion","uid","creationTimestamp","managedFields","ownerReferences","selfLink","generation"):
        s.get("metadata",{}).pop(k, None)
    s["metadata"]["name"]="redhat-registry-pull"
    s["metadata"]["namespace"]="'"${NS}"'"
    s["metadata"]["annotations"]={"lab-infra.copied-from":"openshift-config/pull-secret"}
    s["metadata"]["labels"]={"app.kubernetes.io/part-of":"helpdesk-email-triage"}
    json.dump(s, sys.stdout)
    ' | oc apply -f -
    echo "Done."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-copy-redhat-registry-pull
  namespace: helpdesk-email-triage
  labels:
    app.kubernetes.io/name: copy-redhat-registry-pull
    app.kubernetes.io/part-of: helpdesk-email-triage-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: job-copy-redhat-registry-pull
      restartPolicy: Never
      containers:
        - name: copy
          image: registry.redhat.io/openshift4/ose-cli-rhel9
          env:
            - name: TARGET_NAMESPACE
              value: helpdesk-email-triage
          command:
            - /bin/bash
            - /scripts/copy.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: job-copy-redhat-registry-pull
            defaultMode: 0755
