apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: helpdesk-email-triage

# Not included in the Argo-synced overlay (hf-token.env is gitignored).
# Apply locally: ../../scripts/apply-hf-secret.sh  (from namespaces/base/secrets)
# or: ../../../scripts/apply-hf-secret.sh

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: hf-secret
    envs:
      - hf-token.env
    options:
      labels:
        app.kubernetes.io/part-of: helpdesk-email-triage
