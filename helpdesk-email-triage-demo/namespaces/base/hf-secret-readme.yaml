apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-hf-secret-readme
  namespace: helpdesk-email-triage
  labels:
    app.kubernetes.io/part-of: helpdesk-email-triage-demo
data:
  README: |
    hf-secret is NOT managed by the Argo-synced kustomize overlay (token must stay
    out of git). Create it from the gitignored env file in this tenant:

      cp helpdesk-email-triage-demo/namespaces/base/secrets/hf-token.env.example \
         helpdesk-email-triage-demo/namespaces/base/secrets/hf-token.env
      # set HF_TOKEN=... in hf-token.env
      ./helpdesk-email-triage-demo/scripts/apply-hf-secret.sh

    Or manually:

      oc -n helpdesk-email-triage create secret generic hf-secret \
        --from-literal=HF_TOKEN='<your-huggingface-token>' \
        --dry-run=client -o yaml | oc apply -f -
