apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-hf-secret-readme
  namespace: helpdesk-email-triage
  labels:
    app.kubernetes.io/part-of: helpdesk-email-triage-demo
data:
  README: |
    Create the Hugging Face token secret once (not stored in git):

      oc -n helpdesk-email-triage create secret generic hf-secret \
        --from-literal=HF_TOKEN='<your-huggingface-token>' \
        --dry-run=client -o yaml | oc apply -f -

    RHAII CPU will not become Ready until hf-secret and redhat-registry-pull exist.
    redhat-registry-pull is created by Job job-copy-redhat-registry-pull from the
    cluster pull-secret.
