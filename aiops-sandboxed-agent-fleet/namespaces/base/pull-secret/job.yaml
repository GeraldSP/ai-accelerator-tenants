---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-copy-redhat-registry-pull
  namespace: aiops-inference
  labels:
    app.kubernetes.io/part-of: aiops-sandboxed-agent-fleet
data:
  copy.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    NS="${TARGET_NAMESPACE:-aiops-inference}"
    echo "Copying openshift-config/pull-secret -> ${NS}/redhat-registry-pull"
    oc get secret pull-secret -n openshift-config -o json \
      | python3 -c '
    import json,sys
    s=json.load(sys.stdin)
    for k in ("resourceVersion","uid","creationTimestamp","managedFields","ownerReferences","selfLink","generation"):
        s.get("metadata",{}).pop(k, None)
    s["metadata"]["name"]="redhat-registry-pull"
    s["metadata"]["namespace"]="'"${NS}"'"
    s["metadata"]["annotations"]={"lab-infra.copied-from":"openshift-config/pull-secret"}
    s["metadata"]["labels"]={"app.kubernetes.io/part-of":"aiops-sandboxed-agent-fleet"}
    json.dump(s, sys.stdout)
    ' | oc apply -f -
    # Default SA + common KServe predictor SA need the pull secret for RHAIIS + modelcar
    for sa in default; do
      echo "Ensuring imagePullSecret redhat-registry-pull on SA/${sa}"
      oc -n "${NS}" get sa "${sa}" -o json | python3 -c '
    import json,sys
    sa=json.load(sys.stdin)
    for k in ("resourceVersion","uid","creationTimestamp","managedFields","ownerReferences","selfLink","generation"):
        sa.get("metadata",{}).pop(k, None)
    ips=sa.setdefault("imagePullSecrets", [])
    names={i.get("name") for i in ips if isinstance(i, dict)}
    if "redhat-registry-pull" not in names:
        ips.append({"name":"redhat-registry-pull"})
    json.dump(sa, sys.stdout)
    ' | oc apply -f -
    done
    echo "Done."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-copy-redhat-registry-pull
  namespace: aiops-inference
  labels:
    app.kubernetes.io/name: copy-redhat-registry-pull
    app.kubernetes.io/part-of: aiops-sandboxed-agent-fleet
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Recreate Job on sync if prior run hit backoffLimit
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: job-copy-redhat-registry-pull
      restartPolicy: Never
      containers:
        - name: copy
          image: registry.redhat.io/openshift4/ose-cli-rhel9
          env:
            - name: TARGET_NAMESPACE
              value: aiops-inference
          command:
            - /bin/bash
            - /scripts/copy.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: job-copy-redhat-registry-pull
            defaultMode: 0755
