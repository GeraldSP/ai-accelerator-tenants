apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-inference-secret-readme
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: aiops-sandboxed-agent-fleet
data:
  README: |
    Default (Argo-synced): nemoclaw-inference points at the in-cluster OpenShift AI
    InferenceService in namespace aiops-inference:

      NEMOCLAW_INFERENCE_BASE_URL=http://aiops-llm-predictor.aiops-inference.svc.cluster.local:8000/v1
      NEMOCLAW_MODEL=aiops-llm
      NEMOCLAW_API_KEY=unused   # security.opendatahub.io/enable-auth: false

    GPU node: lab-infra g5.2xlarge MachineSet (A10G). Model: Llama 3.1 8B FP8 modelcar
    (ServingRuntime aligned with demo/module-01 RHAIIS).

    Optional override to a remote endpoint (NIM / OpenAI):

      cp aiops-sandboxed-agent-fleet/namespaces/base/secrets/inference.env.example \
         aiops-sandboxed-agent-fleet/namespaces/base/secrets/inference.env
      # edit values
      ./aiops-sandboxed-agent-fleet/scripts/apply-inference-secret.sh

    Optional GHCR pull auth (openclaw-sandbox image):

      oc -n openshell create secret generic nemoclaw-ghcr \
        --from-literal=GHCR_USER='<github-user>' \
        --from-literal=GHCR_TOKEN='<pat-with-read:packages>' \
        --dry-run=client -o yaml | oc apply -f -

    Upstream fleet: https://github.com/rh-ai-quickstart/aiops-sandboxed-agent-fleet
