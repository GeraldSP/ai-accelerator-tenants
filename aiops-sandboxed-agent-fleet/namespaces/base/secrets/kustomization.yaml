apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshell

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  # Synced by Argo — points at in-cluster RHOAI InferenceService (no real API key).
  - name: nemoclaw-inference
    envs:
      - inference-incluster.env
    options:
      labels:
        app.kubernetes.io/part-of: aiops-sandboxed-agent-fleet
