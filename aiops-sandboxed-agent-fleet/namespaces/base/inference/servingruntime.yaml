apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: rhaiis-cuda
  namespace: aiops-inference
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/runtime-version: v3.2.4
    openshift.io/display-name: RHAIIS (vLLM) CUDA for AIOps fleet
  labels:
    app.kubernetes.io/part-of: aiops-sandboxed-agent-fleet
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8000
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        # Keep KV cache small enough for a single T4 (16 GiB)
        - --max-model-len=4096
        - --disable-uvicorn-access-log
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: VLLM_NO_USAGE_STATS
          value: "1"
      ports:
        - containerPort: 8000
          protocol: TCP
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
