apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-infra-storage-requirements
  namespace: openshift-machine-api
  labels:
    app.kubernetes.io/name: lab-infra-storage
    app.kubernetes.io/part-of: lab-infra
data:
  defaultStorageClass: gp3-csi
  rhaiiModelCachePvc: "20Gi"
  gatewayDataPvc: "1Gi"
  aiopsMinioPvc: "5Gi"
  aiopsTempoStorage: "15Gi"
  aiopsGrafanaPvc: "2Gi"
  aiopsVerdaccioPvc: "2Gi"
  notes: |
    Default StorageClass: gp3-csi (AWS). All tenant PVCs are RWO.

    Helpdesk email triage (RHAII 3.5 CPU):
      - rhaii-model-cache: 20Gi (model weights)
      - gateway-data: 1Gi (ticket vault / file-watcher state)
      Nodes: AVX512 MachineSet (m6i.4xlarge), labeled workload.openshift.io/rhaii-cpu.

    AIOps sandboxed agent fleet:
      Observability / OpenShell PVCs:
        - minio-observability-storage: 5Gi in observability-hub
        - TempoStack storage: 15Gi
        - grafana: 2Gi in monitoring
        - Verdaccio skill registry: 2Gi in openshell
      In-cluster LLM (OpenShift AI KServe RawDeployment):
        - InferenceService aiops-llm in aiops-inference (Llama 3.1 8B FP8 modelcar)
        - Nodes: GPU MachineSet g5.2xlarge (1× A10G 24 GiB), tainted nvidia.com/gpu=NoSchedule
          (RHAIIS vLLM 3.2.4 / demo ServingRuntime is not compatible with T4)
        - Endpoint: http://aiops-llm-predictor.aiops-inference.svc.cluster.local:8000/v1
