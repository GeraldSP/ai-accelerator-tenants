apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-infra-storage-requirements
  namespace: openshift-machine-api
  labels:
    app.kubernetes.io/name: lab-infra-storage
    app.kubernetes.io/part-of: lab-infra
data:
  defaultStorageClass: gp3-csi
  rhaiiModelCachePvc: "20Gi"
  gatewayDataPvc: "1Gi"
  notes: |
    Helpdesk email triage (RHAII 3.5 CPU) expects a default StorageClass that can
    bind RWO PVCs. On this AWS cluster use gp3-csi (already the cluster default).
    PVCs created by the quickstart:
      - rhaii-model-cache: 20Gi (model weights)
      - gateway-data: 1Gi (ticket vault / file-watcher state)
