---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-lab-infra-aiops-gpu-machineset
  namespace: openshift-machine-api
  labels:
    app.kubernetes.io/name: lab-infra-aiops-gpu-machineset
    app.kubernetes.io/part-of: lab-infra
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: job-lab-infra-aiops-gpu-machineset
          image: registry.redhat.io/openshift4/ose-cli-rhel9
          env:
            - name: INSTANCE_TYPE
              # A10G (Ampere) — RHAIIS vLLM 3.2.4 fails on T4 (sm_75) with CUDA Error 803.
              # Matches genai tutorial / demo-friendly single-GPU size.
              value: "g5.2xlarge"
            - name: MACHINE_REPLICAS
              value: "1"
            - name: MACHINE_MIN
              value: "0"
            - name: MACHINE_MAX
              value: "2"
            - name: NODE_VOLUME_SIZE
              value: "100"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/bash
            - -c
            - /scripts/job.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: job-lab-infra-aiops-gpu-machineset
            defaultMode: 0755
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      serviceAccount: job-lab-infra-aiops-gpu-machineset
      serviceAccountName: job-lab-infra-aiops-gpu-machineset
