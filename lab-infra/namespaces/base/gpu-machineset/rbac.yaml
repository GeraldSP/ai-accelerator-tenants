---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-lab-infra-aiops-gpu-machineset
  namespace: openshift-machine-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-lab-infra-aiops-gpu-machineset
rules:
  - apiGroups:
      - machine.openshift.io
    resources:
      - machinesets
    verbs:
      - "*"
  - apiGroups:
      - autoscaling.openshift.io
    resources:
      - machineautoscalers
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-lab-infra-aiops-gpu-machineset
  namespace: openshift-machine-api
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-lab-infra-aiops-gpu-machineset
  namespace: openshift-machine-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-lab-infra-aiops-gpu-machineset
subjects:
  - kind: ServiceAccount
    name: job-lab-infra-aiops-gpu-machineset
    namespace: openshift-machine-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-lab-infra-aiops-gpu-machineset
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-lab-infra-aiops-gpu-machineset
subjects:
  - kind: ServiceAccount
    name: job-lab-infra-aiops-gpu-machineset
    namespace: openshift-machine-api
